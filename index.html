<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Happy Mother's Day ❤️</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      overflow: hidden;
      font-family: 'Arial', sans-serif;
      height: 100vh;
      background: linear-gradient(135deg, #ff9eb5, #ffcce0, #ffe6f0);
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .container {
      text-align: center;
      background: rgba(255,255,255,0.2);
      backdrop-filter: blur(12px);
      padding: 40px;
      border-radius: 30px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.15);
      animation: fadeIn 1.5s ease;
      z-index: 2;
      max-width: 450px;
    }

    .photo {
      width: 280px;
      height: auto;
      border-radius: 25px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      animation: float 4s ease-in-out infinite;
      border: 5px solid white;
    }

    h1 {
      margin-top: 25px;
      font-size: 42px;
      color: white;
      text-shadow: 0 4px 10px rgba(0,0,0,0.2);
      animation: glow 2s infinite alternate;
    }

    p {
      margin-top: 20px;
      font-size: 18px;
      color: white;
      line-height: 1.7;
    }

    button {
      margin-top: 30px;
      padding: 14px 30px;
      border: none;
      border-radius: 50px;
      background: white;
      color: #ff4f81;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
      box-shadow: 0 5px 20px rgba(0,0,0,0.15);
    }

    button:hover {
      transform: scale(1.08);
      background: #ff4f81;
      color: white;
    }

    .message {
      margin-top: 25px;
      font-size: 22px;
      color: white;
      opacity: 0;
      transition: 1s;
    }

    .show {
      opacity: 1;
      transform: translateY(-5px);
    }

    /* Floating hearts */

    .heart {
      position: absolute;
      color: rgba(255,255,255,0.7);
      font-size: 24px;
      animation: hearts 8s linear infinite;
    }

    @keyframes hearts {
      0% {
        transform: translateY(100vh) scale(0.5);
        opacity: 0;
      }

      10% {
        opacity: 1;
      }

      100% {
        transform: translateY(-120vh) scale(1.5);
        opacity: 0;
      }
    }

    @keyframes float {
      0% {
        transform: translateY(0px);
      }

      50% {
        transform: translateY(-12px);
      }

      100% {
        transform: translateY(0px);
      }
    }

    @keyframes glow {
      from {
        text-shadow: 0 0 10px rgba(255,255,255,0.5);
      }

      to {
        text-shadow: 0 0 25px rgba(255,255,255,1);
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: scale(0.8);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

  </style>
</head>

<body>

  <!-- Floating Hearts -->
  <div class="heart" style="left:10%; animation-delay:0s;">❤️</div>
  <div class="heart" style="left:25%; animation-delay:2s;">🌸</div>
  <div class="heart" style="left:40%; animation-delay:4s;">❤️</div>
  <div class="heart" style="left:60%; animation-delay:1s;">💖</div>
  <div class="heart" style="left:75%; animation-delay:3s;">🌷</div>
  <div class="heart" style="left:90%; animation-delay:5s;">❤️</div>

  <div class="container">

    <img src="photo.jpeg" class="photo">

    <h1>Happy Mother's Day ❤️</h1>

    <p>
      Thank you for every hug, every smile, every sacrifice,
      and every moment of love you’ve given me.
      You are truly the most amazing person in my life 🌸
    </p>

    <button onclick="showMessage()">
      Click Me ✨
    </button>

    <div class="message" id="message">
      I love you so much Mom 💖
    </div>

  </div>

  <script>
    function showMessage() {
      document.getElementById("message").classList.add("show");
    }
  </script>

</body>
</html>
